spring:
  application:
    name: grades
  datasource:
    url: jdbc:mysql://localhost:3306/notes
    username: root
    password: ${DB_PASSWORD_API}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    addresses: ${RABBIT_URI}

rabbitmq:
  queue: grades_queue